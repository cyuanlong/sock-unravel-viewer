<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复旦袜纤维级渲染</title>
<style>
:root{--bg:#f4f3ef;--ink:#222428;--muted:#666a72;--card:#fff;--line:#dcdad3}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f23;--ink:#e8e8ea;--muted:#a0a3aa;--card:#272a2f;--line:#3a3d43}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 10px}
p{color:var(--muted);margin:4px 0 12px}
figure{margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto;background:#ddd}
figcaption{padding:8px 12px;font-size:14px;color:var(--muted)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}}
a{color:#3b6fd1}
</style></head><body><main>
<h1>复旦袜纤维级渲染</h1>
<p>纱线来自一条命令复现的结果：33 根连续纱线、113,300 个线圈全部穿在上一圈里，袜头缝合线穿过 144 个线圈。每股约 200 根棉纤维，带毛羽。</p>
<h2>纤维级特写</h2>
<figure><img src="r5_c1f_seal_2_14.jpg" alt="小腿校徽纤维特写"><figcaption>小腿校徽处：蓝色和白色棉纱的线圈，每根纱由两股、每股约 200 根纤维组成</figcaption></figure>
<figure><img src="r5_c1f_heel_-174_14.jpg" alt="袜跟纤维特写"><figcaption>袜跟处：两侧伸出的短纱头是截取局部时切断的，不是破洞</figcaption></figure>
<figure><img src="r5_c1f_toe_7_14.jpg" alt="袜头缝合线纤维特写"><figcaption>袜头：中间那根白色缝合线逐个穿过上下两边的线圈</figcaption></figure>
<h2>整袜（股线级）</h2>
<div class="g4">
<figure><img src="r5_c1_160_10.jpg" alt="后侧"><figcaption>后侧</figcaption></figure>
<figure><img src="r5_c1_200_40.jpg" alt="近景"><figcaption>小腿近景</figcaption></figure>
<figure><img src="r5_c1_95_10.jpg" alt="外侧"><figcaption>外侧</figcaption></figure>
<figure><img src="r5_c1_265_10.jpg" alt="内侧"><figcaption>内侧</figcaption></figure>
</div>
<p><a href="./">打开抽丝查看器</a></p>
</main></body></html>
